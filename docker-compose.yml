# =============================================================================

# Docker Compose — Chat AI RAG (API Flask + site React com Nginx)

# =============================================================================

# Uso recomendado para iniciantes (Windows):  scripts\docker-subir.ps1

# Uso manual:  docker compose up --build

#

# Antes: copie .env.example para .env e preencha as chaves de API.

#

# --- O que existem aqui (três serviços) ---

#   mysql → imagem mysql:8.0            → container chatairag-mysql → banco para cadastro de clientes

#   api  → imagem chatairag-api:local   → container chatairag-api   → Flask/Gunicorn (Python)

#   web  → imagem chatairag-web:local   → container chatairag-web   → Nginx servindo o React já

#          compilado (arquivos estáticos HTML/JS/CSS; não roda "npm start" dentro do container)

#

#   docker compose build     → constrói as imagens api e web (mysql usa imagem pronta)

#   docker compose up        → sobe mysql + api + web

#   Só "build" sem "up"      → imagens existem, mas containers podem não estar rodando (Desktop vazio em Containers)

# =============================================================================

networks:
  chatairag:
    driver: bridge

services:
  # --- MySQL (cadastro de clientes; mesma rede que a API: host = nome do serviço `mysql`) ---

  mysql:
    image: mysql:8.0
    container_name: chatairag-mysql
    restart: unless-stopped
    networks:
      - chatairag
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-devroot}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-banco_vendas}
      MYSQL_USER: ${MYSQL_USER:-chatairag}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-chatairag_secret}
    ports:
      - "${MYSQL_PORT:-3308}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 40s

  # --- Backend (Flask + Gunicorn) ---

  api:
    build:
      context: .

      dockerfile: docker/Dockerfile.api

    image: chatairag-api:local

    container_name: chatairag-api

    env_file:
      - .env

    ports:
      - "5000:5000"

    networks:
      - chatairag

    depends_on:
      mysql:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",

          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:5000/health'', timeout=8)"',
        ]

      interval: 20s

      timeout: 8s

      retries: 5

      start_period: 60s

  # --- Frontend (Nginx + arquivos estáticos do React) ---

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      # frontend/.env (REACT_APP_*) é copiado no build; ver .dockerignore (/.env ignora só a raiz).

    image: chatairag-web:local

    container_name: chatairag-web

    ports:
      - "8080:80"

    networks:
      - chatairag

    depends_on:
      api:
        condition: service_healthy

    restart: unless-stopped

volumes:
  mysql_data:
