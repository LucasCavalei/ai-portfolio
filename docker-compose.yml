networks:
  chatairag:
    driver: bridge

services:
  # -------------------
  # Backend (Flask/Gunicorn)
  # -------------------
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: chatairag-api:local
    container_name: chatairag-api
    env_file:
      - .env
    ports:
      - "5000:5000"
    networks:
      - chatairag
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=8)\"",
        ]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 60s

  # -------------------
  # Frontend (React build + Nginx)
  # -------------------
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    image: chatairag-web:local
    container_name: chatairag-web
    ports:
      - "8080:80"
    networks:
      - chatairag
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
